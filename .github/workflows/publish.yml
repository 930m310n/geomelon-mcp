name: Publish

# release: publishes to npm, then to the official MCP Registry.
# workflow_dispatch: registry publish only — recovery path when the registry
# job failed but the npm version is already live.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm >= 11.5.1
      - run: npm install -g npm@latest
      - name: Check release tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(jq -r .version package.json)
          if [ "$TAG" != "$PKG" ]; then
            echo "Release tag $TAG does not match package.json version $PKG"
            exit 1
          fi
      - run: npm ci
      - run: npm publish

  publish-mcp-registry:
    runs-on: ubuntu-latest
    needs: publish-npm
    if: ${{ !cancelled() && needs.publish-npm.result != 'failure' }}
    steps:
      - uses: actions/checkout@v7
      - name: Sync server.json version from package.json
        run: |
          VERSION=$(jq -r .version package.json)
          jq --arg v "$VERSION" '.version = $v | .packages[].version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json
          cat server.json
      - name: Install mcp-publisher
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
