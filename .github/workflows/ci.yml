name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check server.json version matches package.json
        run: |
          PKG=$(jq -r .version package.json)
          SRV=$(jq -r .version server.json)
          SRV_PKG=$(jq -r '.packages[0].version' server.json)
          if [ "$PKG" != "$SRV" ] || [ "$PKG" != "$SRV_PKG" ]; then
            echo "Version drift: package.json=$PKG server.json=$SRV packages[0]=$SRV_PKG"
            exit 1
          fi
